name: ube
description: "Digital Barangay E-System"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # 🔐 Auth & Database
  supabase_flutter: ^2.12.0

  # 🔗 Sharing
  share_plus: ^12.0.1

  # 📁 File handling
  file_picker: ^11.0.2
  path_provider: ^2.1.2

  # 📊 CSV
  csv: ^5.0.2

  # 📄 PDF generation & preview
  pdf: ^3.10.7
  printing: ^5.12.0
  syncfusion_flutter_pdfviewer: ^33.1.47

  # ✏️ Rich text editor
  flutter_quill: 11.5.0

  # 🕒 Date formatting
  intl: ^0.20.2

  # 📦 State Management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 🔤 App name changer
  launcher_name: ^1.0.2

  # 🎨 App icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png

  fonts:
    - family: SNPro
      fonts:
        - asset: assets/fonts/SNPro-Regular.ttf
        - asset: assets/fonts/SNPro-Medium.ttf
        - asset: assets/fonts/SNPro-Bold.ttf

# 🔤 App display name
launcher_name:
  default: "Unified Barangay eService"

# 🎨 App icon config
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true